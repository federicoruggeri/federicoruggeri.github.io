baseURL: 'https://federicoruggeri.github.io/'
title: Federico Ruggeri
locale: en-US
enableRobotsTXT: true
disableKinds: [taxonomy, term]
summaryLength: 30

outputs:
  home: [HTML]
  section: [HTML]

markup:
  goldmark:
    renderer:
      unsafe: true

params:
  role: Postdoctoral Research Fellow
  affiliation: Language Technologies Lab, DISI, University of Bologna
  affiliationURL: https://nlp.unibo.it/
  description: Federico Ruggeri is a postdoctoral researcher in natural language processing at the University of Bologna. He studies how models use, structure, and extract knowledge from text.
  license: CC BY-NC-ND 4.0
  licenseURL: https://creativecommons.org/licenses/by-nc-nd/4.0/
  links:
    - {name: Email, icon: email, url: 'mailto:federico.ruggeri6@unibo.it'}
    - {name: Scholar, icon: scholar, url: 'https://scholar.google.com/citations?user=moOd0BwAAAAJ'}
    - {name: ORCID, icon: orcid, url: 'https://orcid.org/0000-0002-1697-8586'}
    - {name: GitHub, icon: github, url: 'https://github.com/federicoruggeri'}
    - {name: LinkedIn, icon: linkedin, url: 'https://www.linkedin.com/in/federico-ruggeri-a87647145/'}

menus:
  main:
    - {name: Publications, url: /publications/, weight: 10}
    - {name: CV, url: /cv/, weight: 20}
    - {name: Teaching, url: /teaching/, weight: 30}
    - {name: News, url: /news/, weight: 40}
