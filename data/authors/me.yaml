bio: |
  I am a Postdoctoral Research Fellow in the Department of Computer Science and Engineering
  (DISI) at the University of Bologna and a member of the Language Technologies Lab.
  I develop natural language processing systems that extract structured knowledge from text
  and integrate unstructured knowledge into interpretable models, with applications in
  argument mining and legal analytics.
