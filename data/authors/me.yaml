bio: |
  I hold the position of Post-doc Research Fellow at the Computer Science and Engineering
  Department (DISI) of the University of Bologna and I’m mainly researching knowledge extraction and Neuro-symbolic solutions for UKI.
  
  My main research area is integrating unstructured knowledge into deep learning models. I’m
  currently focusing on Natural Language Processing (NLP) and Argument Mining, a branch
  of NLP that aims at extracting arguments from unstructured texts.
