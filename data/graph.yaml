# Research statement as an argument graph, rendered on the homepage.
# The vision (`claim`) is the root. Each direction supports it through `relation`. Each theme and each current focus supports its direction.
# A node card shows `summary`, the `flow` figure (steps with an optional `note`, and a `caption`), `points`,
# `pubs`, and `links`. `pubs` lists publication bundle names under content/publications/; the build fails on an
# unknown name. `links` at the end connect the current focus of different directions, as the statement does.

claim:
  id: vision
  label: Given input X and knowledge K, provide output Y and update K.
  summary: NLP systems should learn to generate, distil, and use knowledge from unstructured text, and their success should be measured by their accuracy and by the reasons behind it.
  flow:
    steps:
      - {label: Input X and knowledge K, note: 'definitions, guidelines, explanations'}
      - {label: Model, note: explains each prediction}
      - {label: Output Y and updated K, note: global decision criteria that experts can revise}
    caption: The focus moves from Y alone to Y and K.
  points:
    - The knowledge K is any information that helps humans understand a problem, about the task, the domain, or the model.
    - A model that flags a contract clause as unfair should ground its decision in definitions of legal unfairness.
    - The domains are political debates, social media content such as hate speech, and legal texts.

directions:
  - id: uki
    label: Unstructured Knowledge Integration
    relation: uses K
    summary: How models use textual knowledge, such as definitions, guidelines, and explanations.
    flow:
      steps:
        - {label: Textual knowledge, note: no structured form required}
        - {label: Model}
        - {label: Prediction grounded in knowledge}
    points:
      - Structured knowledge is often unavailable, prohibitively costly, or unfeasible to distil.
      - Unstructured text is used directly as a form of knowledge.
    themes:
      - id: formalising-uki
        label: Formalising UKI
        summary: Unstructured Knowledge Integration (UKI) decomposes into three processes.
        flow:
          steps:
            - {label: Integration, note: how knowledge is employed}
            - {label: Mapping, note: how knowledge links to the input}
            - {label: Validation, note: whether requirements hold}
        points:
          - Knowledge acts as complementary information, as a support for reasoning, or as behavioural constraints.
          - Learning with textual knowledge requires aligning its representation, purpose, integration, and validation.
        pubs: [ruggeri-2022-phd-thesis]
      - id: integrating-knowledge
        label: How to integrate knowledge
        summary: A model compares the input with a knowledge base of natural language explanations.
        flow:
          steps:
            - {label: Contract clause}
            - {label: Memory network, note: compares the clause with legal rationales}
            - {label: Unfair or fair, note: with the most relevant rationales}
        points:
          - Memory networks find relevant rationales without links between clauses and rationales in training.
          - Strong supervision on the selected rationales improves Mapping at no cost in classification performance.
          - Priority sampling scales the knowledge base to hundreds of entries with limited memory overhead.
          - Knowledge generated by one model, the meaning of pejorative epithets, improves misogyny detection in another.
        pubs: [lagioia-etal-2019-detecting, ruggeri-etal-2022-detecting, ruggeri-etal-2024-combining, muti-et-al-2024-pejorativity]
      - id: knowledge-as-instructions
        label: Knowledge as instructions
        summary: Definitions and guidelines instruct both LLMs and human annotators.
        flow:
          steps:
            - {label: Annotation guidelines}
            - {label: Annotation, note: GCAM keeps the guideline behind each label}
            - {label: Labels and guideline criteria}
        points:
          - 493 hate speech definitions from more than 100 cultures and five domains change the predictions of LLMs.
          - The predictions change with the complexity of the definition in the prompt.
          - GCAM reduces information loss, enables data reuse across tasks, and supports fine-grained error analysis.
        pubs: [korre-etal-2025-untangling-sca, ruggeri-etal-2023-definition-prescriptive, ruggeri-et-al-2026-gcam]
    future:
      id: uki-next
      label: Do models use the knowledge they receive?
      summary: Validation checks whether predictions actually depend on the knowledge a model receives.
      flow:
        steps:
          - {label: Input text}
          - {label: Highlight and selected definition}
          - {label: Prediction}
        caption: Swapping definitions across labels at test time shows whether predictions depend on them.
      points:
        - Extend the analysis of UKI to in-context learning and prompting.
        - Evaluate whether the selected definitions help experts detect incorrect predictions.
        - Provide social context and norms as feedback during training, and test whether the model uses them.

  - id: argumentation
    label: Argumentation
    relation: structures K
    summary: How to represent reasoning in text and in models as premises, conclusions, and the relations between them.
    flow:
      steps:
        - {label: Premises}
        - {label: Support or attack, note: argument schemes characterise the inference}
        - {label: Conclusion}
    points:
      - Abstract argumentation determines which arguments prevail from the attacks between them.
      - Argumentation analyses human reasoning in specialised domains, and evaluates reasoning in LLMs.
    themes:
      - id: political-debates
        label: Political debates
        summary: The audio of a speech carries prosody and rhythm that its transcript loses.
        flow:
          steps:
            - {label: Text and audio of a speech}
            - {label: Multimodal model}
            - {label: Fallacy class}
        points:
          - MM-USED-fallacy holds 1,891 text-audio pairs from U.S. presidential debates.
          - Audio consistently improves fallacy classification across architectures.
          - In the MM-ArgFallacy2025 shared task, text-based systems were the most effective.
          - MAMKit consolidates datasets and models in an open PyTorch toolkit.
        pubs: [mancini-etal-2022-multimodal, mancini-etal-2024-multimodal, mancini-etal-2025-overview, mancini-etal-2024-mamkit]
        links:
          - {name: MAMKit, url: 'https://github.com/nlp-unibo/mamkit'}
      - id: legal-argumentation
        label: Legal argumentation
        summary: Courts justify their decisions through chains of legal and factual premises.
        flow:
          steps:
            - {label: CJEU decision}
            - {label: Argumentative elements, note: type and argument scheme}
            - {label: Premises linked to outcomes}
        points:
          - Demosthenes annotates 40 decisions of the Court of Justice of the European Union (CJEU) on fiscal State aid.
          - Legal-BERT performs consistently well, while tf-idf features remain competitive.
          - Legal principles extracted automatically from 64 decisions are comparable to expert-made collections.
        pubs: [grundler-etal-2022-cjeu-arguments, santin-etal-2023-argumentation-cjeu, percin-etal-2026-legal-principles]
      - id: reasoning-in-llms
        label: Reasoning in LLMs
        summary: Argumentation makes explicit how LLM reasoning depends on its form, task, and domain.
        flow:
          steps:
            - {label: Message}
            - {label: Warrant, note: the implied reasoning link}
            - {label: Misogynistic meaning}
          caption: Toulmin's model frames implicit misogyny detection as argumentative reasoning.
        points:
          - LLMs often fail to generate correct warrants, and the correctness of their explanations is poorly related to that of their predictions.
          - In claim verification, LLMs address deductive reasoning but consistently fail on abductive reasoning.
          - Decomposing a claim helps only when each sub-claim has its own aligned evidence.
          - As judges of legal summaries, LLMs moderately agree with experts.
        pubs: [ruggeri-etal-2026-argument-mining-llms, muti-etal-2024-language, dougrez-lewis-etal-2025-assessing, akhter-etal-2026-alignment-bottleneck, grundler-etal-2026-llm-judge]
      - id: argumentative-dialogues
        label: Argumentative dialogues
        summary: Scientific discussions combine information seeking with argumentation.
        flow:
          steps:
            - {label: Scientific paper}
            - {label: Argumentative graph}
            - {label: Supporting facts at each dialogue turn}
        points:
          - ArgSciChat collects 41 dialogues between scientists on 20 NLP papers.
          - Its sentences carry exploratory and argumentative intents.
        pubs: [ruggeri-etal-2023-dataset, ruggeri-2022-phd-thesis]
    future:
      id: argumentation-next
      label: Argumentation as the structure of extracted knowledge
      summary: Each premise of an extracted argument is grounded in highlighted text.
      flow:
        steps:
          - {label: Highlighted text}
          - {label: Premises, note: grounded or marked as reconstructed}
          - {label: Conclusion}
      points:
        - Show where an LLM challenges, rather than confirms, the reasoning of a user.
        - Annotate arguments directly on audio, rather than on transcripts.
        - Label the links between legal premises and the decisions they cite with argument schemes.

  - id: extraction
    label: Knowledge Extraction
    relation: updates K
    summary: How to extract the knowledge a model relies on, from highlights of single predictions to global decision criteria.
    flow:
      steps:
        - {label: Input text}
        - {label: Highlight, note: the portion of the input the model uses}
        - {label: Prediction}
      caption: A self-explaining model predicts from its highlight alone.
    points:
      - Structured knowledge is interpretable by design, so it can serve as a proxy for model decisions.
      - Interpretability is a first step towards Knowledge Extraction, since experts reason in general criteria.
    themes:
      - id: structured-patterns
        label: Structured patterns
        summary: Graph neural network clusters encode fragments of the parse tree.
        flow:
          steps:
            - {label: Sentence}
            - {label: Constituency tree}
            - {label: Constrained pooling}
            - {label: Inspectable clusters}
        points:
          - Constraint coefficients are learned through a dual Lagrangian framework.
          - The architecture outperforms other graph neural networks on four Argument Mining corpora.
          - The extracted structures depend on an external parser.
        pubs: [ruggeri-etal-2021-tree-constrained]
      - id: highlight-extraction
        label: Highlight extraction
        summary: Select-then-predict architectures extract highlights by design.
        flow:
          steps:
            - {label: Input text}
            - {label: Generator, note: selects the highlight}
            - {label: Predictor, note: sees the highlight only}
            - {label: Label}
        points:
          - Cooperative training of generator and predictor leads to interlocking.
          - GenSPP trains them disjointly via genetic global search, with no learning overhead.
          - GenSPP extracts higher-quality highlights on a synthetic benchmark and on HateXplain, with lower variance.
        pubs: [ruggeri-signorelli-2025-interlocking]
        links:
          - {name: GenSPP code, url: 'https://github.com/nlp-unibo/gen-spp'}
      - id: reproducible-evaluation
        label: Reproducible evaluation
        summary: One library runs highlight extraction methods on shared corpora and metrics.
        flow:
          steps:
            - {label: Architectures and corpora}
            - {label: One configuration system}
            - {label: Shared metrics, note: sufficiency and comprehensiveness}
        points:
          - Each work typically adopts its own corpora, splits, and metrics.
          - Widely adopted benchmarks show data leakage between splits, small test sets, and single annotations.
        links:
          - {name: pyhighlights, url: 'https://github.com/nlp-unibo/pyhighlights'}
    future:
      id: extraction-next
      label: From local highlights to global criteria
      summary: Aggregating local explanations into global criteria lets the model update K.
      flow:
        steps:
          - {label: Local highlights}
          - {label: Aggregation, note: 'topic modelling, prototypes, neural clustering'}
          - {label: Global decision criteria}
      points:
        - Control the length and contiguity of highlights.
        - Extract multiple highlights from one input, each an abstract concept with its own relations.

links:
  - {from: extraction-next, to: uki-next, label: concepts implement Mapping}
  - {from: extraction-next, to: argumentation-next, label: highlights instantiate premises}
  - {from: uki-next, to: argumentation-next, label: knowledge used as premises}
