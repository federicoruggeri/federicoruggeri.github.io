name: Set up site toolchain
description: Install the pinned Hugo release used to build the site.

runs:
  using: composite
  steps:
    - name: Install Hugo
      shell: bash
      env:
        # Update the version and the checksum of hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz together.
        HUGO_VERSION: 0.167.0
        HUGO_SHA256: 0163f5c3deddac1f494a1629ddc40c65d18de9d5794facd98f7f96ac2c7d8957
      run: |
        curl -sSL -o hugo.tar.gz \
          "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
        echo "${HUGO_SHA256}  hugo.tar.gz" | sha256sum --check --strict
        sudo tar -xzf hugo.tar.gz -C /usr/local/bin hugo
        rm hugo.tar.gz
